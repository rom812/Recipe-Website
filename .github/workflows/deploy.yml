name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify GitHub Pages is already configured for workflow builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pages",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "github-actions-pages-check",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  body = json.load(response)
                  build_type = body.get("build_type")
                  if build_type != "workflow":
                      sys.stderr.write(
                          "GitHub Pages is enabled but not configured for workflow builds "
                          f"(current: {build_type}).\n"
                      )
                      sys.stderr.write(
                          "Update the Pages build settings to 'GitHub Actions' in the repository "
                          "settings and re-run the workflow.\n"
                      )
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  sys.stderr.write(
                      "GitHub Pages is not enabled. Enable GitHub Pages with the 'GitHub Actions' "
                      "source in repository settings before re-running.\n"
                  )
                  sys.exit(1)
              message = "Unable to verify GitHub Pages configuration (status: {}). "
              message += "Ensure the GITHUB_TOKEN has 'pages: write' permission or enable Pages manually.\n"
              sys.stderr.write(message.format(exc.code))
              sys.exit(1)
PY

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
